alerts:
  - name: high_latency_p95
    severity: critical
    condition: p95_latency_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2.0
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: retrieval_degradation
    severity: warning
    condition: retrieval_success_rate_pct < 90.0
    duration: 5m
    type: symptom-based
    channel: slack
    owner: rag-platform-team
    runbook: docs/alerts.md#alert-3
